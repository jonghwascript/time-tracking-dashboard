<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />

  <title>Frontend Mentor | Time tracking dashboard</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <main>
    <section>
      <header>
        <img src="./images/image-jeremy.png" alt="Jeremy Robson">
        <p>Report for</p>
        <h1>Jeremy Robson</h1>
      </header>
      <nav>
        <button>Daily</button>
        <button>Weekly</button>
        <button>Monthly</button>
      </nav>
    </section>
    <section class="work">
      <header>
        <h2>Work</h2>
        <img src="./images/icon-ellipsis.svg" alt="">
      </header>
      <div class="stat-content">
        <p class="hours">
          <strong>32hrs</strong>
        </p>
        <p class="recently">
          <strong>32hrs</strong>
        </p>
      </div>
    </section>
    <section class="play">
      <header>
        <h2>Play</h2>
        <img src="./images/icon-ellipsis.svg" alt="">
      </header>
      <div class="stat-content">
        <p class="hours">
          <strong>32hrs</strong>
        </p>
        <p class="recently">
          <strong>32hrs</strong>
        </p>
      </div>
    </section>
    <section class="study">
      <header>
        <h2>Study</h2>
        <img src="./images/icon-ellipsis.svg" alt="">
      </header>
      <div class="stat-content">
        <p class="hours">
          <strong>32hrs</strong>
        </p>
        <p class="recently">
          <strong>32hrs</strong>
        </p>
      </div>
    </section>
    <section class="exercise">
      <header>
        <h2>Exercise</h2>
        <img src="./images/icon-ellipsis.svg" alt="">
      </header>
      <div class="stat-content">
        <p class="hours">
          <strong>32hrs</strong>
        </p>
        <p class="recently">
          <strong>32hrs</strong>
        </p>
      </div>
    </section>
    <section class="social">
      <header>
        <h2>Social</h2>
        <img src="./images/icon-ellipsis.svg" alt="">
      </header>
      <div class="stat-content">
        <p class="hours">
          <strong>32hrs</strong>
        </p>
        <p class="recently">
          <strong>32hrs</strong>
        </p>
      </div>
    </section>
    <section class="self-Care">
      <header>
        <h2>Self Care</h2>
        <img src="./images/icon-ellipsis.svg" alt="">
      </header>
      <div class="stat-content">
        <p class="hours">
          <strong>32hrs</strong>
        </p>
        <p class="recently">
          <strong>32hrs</strong>
        </p>
      </div>
    </section>
  </main>
  <footer class="attribution">
    Challenge by
    <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by
    <a href="https://www.frontendmentor.io/profile/jonghwascript">jonghwascript</a>.
  </footer>
</body>

</html>
